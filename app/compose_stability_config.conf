// Mark standard Kotlin collection interfaces as stable for Compose.
// This prevents unnecessary recompositions when using List/Set/Map in State.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map

// java.time types are immutable value types. Marking them stable keeps presentation State
// with LocalDateTime/LocalDate fields (e.g. coupon form dates) skippable.
java.time.LocalDateTime
java.time.LocalDate
java.time.Instant
